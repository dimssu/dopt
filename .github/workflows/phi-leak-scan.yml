name: phi-leak-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pattern scan
        run: |
          set -euo pipefail
          # Block obvious PHI leaks in code, fixtures, and test files.
          # SSN, phone, email, MRN-like patterns. Tightened over time.
          patterns=(
            '\b\d{3}-\d{2}-\d{4}\b'
            '\b(?:MRN|R-)\d{4,}\b'
          )
          found=0
          for p in "${patterns[@]}"; do
            if grep -RnE "$p" --include='*.{ts,tsx,js,py,json,md,yml,yaml}' \
                --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
                --exclude='**/fixtures/**' .; then
              echo "PHI-like pattern matched: $p"
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::PHI-like patterns found in source — review and either redact or move to an allow-listed fixtures directory."
            exit 1
          fi
